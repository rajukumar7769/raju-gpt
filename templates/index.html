<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% load static %}
  <title>RAJU-GPT</title>
  {% csrf_token %}

  <!-- Bootstrap & FontAwesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    :root {
      --sidebar-width: 250px;
    }

    body {
      transition: background-color 0.3s ease, color 0.3s ease;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }

    body.light-mode {
      background-color: #ffffff;
      color: #212529;
    }

    .bg-light-mode {
      background-color: #f8f9fa !important;
      color: #212529 !important;
    }

    .bg-dark-mode {
      background-color: #1f1f1f !important;
      color: #e0e0e0 !important;
    }

    .fixed-top-bar {
      z-index: 1100;
    }

    #sidebar {
      width: var(--sidebar-width);
      transition: transform 0.3s ease;
    }

    #sidebar.collapsed {
      transform: translateX(-100%);
    }

    #main-content {
      margin-left: var(--sidebar-width);
      transition: margin-left 0.3s ease;
      padding-top: 70px;
      height: calc(100vh - 140px);
      overflow-y: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    #sidebar.collapsed + #main-content {
      margin-left: 0;
    }

    #input-container {
      position: fixed;
      bottom: 0;
      left: var(--sidebar-width);
      right: 0;
      padding: 1rem;
      z-index: 1050;
      background-color: #f8f9fa;
      transition: all 0.3s ease;
    }

    body.dark-mode #input-container {
      background-color: #1f1f1f;
    }

    .profile-button img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .dropdown-menu {
      min-width: 220px;
      border-radius: 10px;
    }

    .message-bubble {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .message-wrapper {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .bot .message-bubble {
      background-color: #f0f0f0;
      color: #000;
    }

    body.dark-mode .bot .message-bubble {
      background-color: #333;
      color: #fff;
    }

    .user {
      flex-direction: row-reverse;
      align-items: flex-end;
    }

    .user .message-bubble {
      background-color: #d1e7dd;
      color: #000;
    }

    body.dark-mode .user .message-bubble {
      background-color: #2e7d32;
      color: #fff;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .typing-animation {
      opacity: 1;
    }

    @media (max-width: 768px) {
      #input-container {
        left: 0 !important;
      }

      #main-content {
        margin-left: 0 !important;
      }

      #sidebar {
        position: fixed;
        top: 56px;
        height: calc(100% - 56px);
        z-index: 1055;
      }
    }

    .input-group .form-control {
      border-radius: 50px 0 0 50px;
      padding: 0.75rem 1rem;
    }

    .input-group .btn {
      border-radius: 0 50px 50px 0;
    }

    body.dark-mode .input-group .form-control {
      background-color: #333;
      color: #fff;
      border-color: #555;
    }

    body.dark-mode .input-group .form-control::placeholder {
      color: #bbb;
    }

    body.dark-mode .btn-outline-secondary {
      border-color: #777;
      color: #ccc;
    }

    body.dark-mode .btn-outline-secondary:hover {
      background-color: #444;
    }

    body.dark-mode .btn-dark {
      background-color: #222;
      border-color: #555;
    }

    body.dark-mode .btn-outline-success {
      border-color: #4caf50;
      color: #4caf50;
    }

    body.dark-mode .btn-outline-success:hover {
      background-color: #4caf50;
      color: #fff;
    }

    body.dark-mode .dropdown-menu {
      background-color: #2b2b2b;
    }

    body.dark-mode .dropdown-item {
      color: #ddd;
    }

    body.dark-mode .dropdown-item:hover {
      background-color: #444;
    }
  </style>
</head>

<body class="light-mode">

  <!-- Top Bar -->
  <div class="fixed-top-bar d-flex justify-content-between align-items-center px-3 py-2 bg-light-mode position-fixed top-0 start-0 end-0 shadow" id="top-bar">
    <div class="d-flex align-items-center gap-2">
      <button id="toggle-sidebar" class="btn btn-outline-secondary"><i class="fas fa-bars"></i></button>
    </div>
    <h3 class="text-center fw-bold m-0">RAJU-GPT</h3>
    <div class="d-flex align-items-center gap-3">
      <button id="export-btn" class="btn btn-outline-success" title="Export chat"><i class="fas fa-download"></i></button>
      <button id="clear-btn" class="btn btn-outline-danger" title="Clear chat"><i class="fas fa-trash"></i></button>

      <!-- Profile Dropdown -->
      <div class="dropdown">
        <button class="btn border-0 p-0 profile-button dropdown-toggle" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          <img src="{% static 'media/my_pic.png' %}" alt="Profile" class="rounded-circle" />
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="profileDropdown">
          <li><a class="dropdown-item" href="{% url 'profile' %}"><i class="fas fa-user me-2"></i>Profile</a></li>
          <li><a class="dropdown-item" href="{% url 'settings' %}"><i class="fas fa-cog me-2"></i>Settings</a></li>
          <li><a class="dropdown-item" href="{% url 'upgrade_plan' %}"><i class="fas fa-star me-2"></i>Upgrade Plan</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="{% url 'logout' %}"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
        </ul>
      </div>

      <button id="toggle-mode" class="btn btn-outline-secondary">
        <i id="mode-icon" class="fas fa-sun"></i> Mode
      </button>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="container-fluid">
    <div class="row">
      <aside id="sidebar" class="bg-light-mode p-3 vh-100 d-flex flex-column position-fixed top-0 start-0" style="margin-top: 56px;">
        <h5 class="text-primary mb-3">Menu</h5>
        <nav class="mb-4">
          <ul class="list-unstyled">
            <li class="mb-2"><a href="#" class="text-decoration-none"><i class="fas fa-comments me-2"></i>RAJU-GPT</a></li>
            <li class="mb-2"><a href="#" class="text-decoration-none"><i class="fas fa-search me-2"></i>SearchGPT</a></li>
          </ul>
        </nav>
        <footer class="mt-auto">
          <button class="btn btn-primary w-100">Upgrade Plan</button>
        </footer>
      </aside>

      <!-- Main Content -->
      <main id="main-content" class="col">
        <div id="messages"></div>
      </main>
    </div>
  </div>

  <!-- Input Field -->
  <div id="input-container">
    <div class="input-group shadow-sm">
      <input type="text" class="form-control" id="user-input" placeholder="Ask anything..." />
      <button id="mic-btn" class="btn btn-outline-secondary"><i class="fas fa-microphone"></i></button>
      <button id="send-btn" class="btn btn-dark"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const body = document.body;
    const sidebar = document.getElementById('sidebar');
    const inputContainer = document.getElementById('input-container');
    const topBar = document.getElementById('top-bar');
    const toggleSidebarButton = document.getElementById('toggle-sidebar');
    const toggleModeButton = document.getElementById('toggle-mode');
    const modeIcon = document.getElementById('mode-icon');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const messagesContainer = document.getElementById('messages');
    const micBtn = document.getElementById('mic-btn');

    toggleSidebarButton.onclick = () => {
      sidebar.classList.toggle('collapsed');
      const leftValue = sidebar.classList.contains('collapsed') ? '0' : 'var(--sidebar-width)';
      document.getElementById('main-content').style.marginLeft = leftValue;
      inputContainer.style.left = leftValue;
    };

    toggleModeButton.onclick = () => {
      const darkMode = body.classList.toggle('dark-mode');
      body.classList.toggle('light-mode', !darkMode);
      modeIcon.className = darkMode ? 'fas fa-moon' : 'fas fa-sun';
      [sidebar, topBar].forEach(el => {
        el.classList.toggle('bg-dark-mode', darkMode);
        el.classList.toggle('bg-light-mode', !darkMode);
      });
    };

    // CSRF helper
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    async function loadHistory() {
      try {
        const res = await fetch('/chat-history/');
        if (!res.ok) return;
        const data = await res.json();
        (data.items || []).forEach(item => {
          if (item.user_message) appendMessage('user', item.user_message);
          if (item.bot_response) appendMessage('bot', item.bot_response);
        });
      } catch (_) {}
    }

    document.addEventListener('DOMContentLoaded', loadHistory);

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendMessage(sender, text) {
      const wrapper = document.createElement('div');
      wrapper.classList.add('message-wrapper', sender);

      const avatar = document.createElement('img');
      avatar.src = sender === 'user' ? '{% static "media/my_pic.png" %}' : '{% static "media/gpt.png" %}';
      avatar.classList.add('avatar');

      const bubble = document.createElement('div');
      bubble.classList.add('message-bubble');
      bubble.innerHTML = sender === 'bot' ? marked.parse(text) : text;

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      messagesContainer.appendChild(wrapper);
      scrollToBottom();
    }

    function simulateTyping(text) {
      const wrapper = document.createElement('div');
      wrapper.classList.add('message-wrapper', 'bot');

      const avatar = document.createElement('img');
      avatar.src = '{% static "media/gpt.png" %}';
      avatar.classList.add('avatar');

      const bubble = document.createElement('div');
      bubble.classList.add('message-bubble', 'typing-animation');

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      messagesContainer.appendChild(wrapper);

      let i = 0;
      const interval = setInterval(() => {
        bubble.textContent += text[i++];
        scrollToBottom();
        if (i >= text.length) clearInterval(interval);
      }, 30);
    }

    sendBtn.onclick = () => {
      const message = userInput.value.trim();
      if (!message) return;
      
      appendMessage('user', message);
      userInput.value = '';
      
      // Show loading indicator
      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'message-wrapper bot';
      loadingMsg.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="message-bubble typing-animation">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      `;
      const messagesContainer = document.getElementById('messages');
      messagesContainer.appendChild(loadingMsg);
      scrollToBottom();
      
      // Disable send button
      sendBtn.disabled = true;
      sendBtn.innerHTML = '⏳ Sending...';
      
      const csrftoken = getCookie('csrftoken');
      
      // Create abort controller for timeout
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 120000); // 2 minute timeout
      
      fetch('/get-response/', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'X-CSRFToken': csrftoken
        },
        body: JSON.stringify({ message }),
        signal: controller.signal
      })
      .then(res => {
        clearTimeout(timeoutId);
        console.log('Response status:', res.status);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        return res.json();
      })
      .then(data => {
        console.log('Response data:', data);
        
        // Remove loading indicator
        loadingMsg.remove();
        
        if (data.response) {
          simulateTyping(data.response);
        } else if (data.error) {
          appendMessage('bot', `❌ Error: ${data.error}`);
        } else {
          appendMessage('bot', '❌ No response received from server');
        }
      })
      .catch(err => {
        clearTimeout(timeoutId);
        console.error('Error:', err);
        
        // Remove loading indicator
        loadingMsg.remove();
        
        let errorMsg = '';
        if (err.name === 'AbortError') {
          errorMsg = '⏱️ Request timeout (120s) - The model took too long to respond. Try a simpler question.';
        } else if ((err.message || '').includes('HTTP 429')) {
          errorMsg = '🚦 Too many requests. Please wait a moment and try again.';
        } else {
          errorMsg = `❌ Error: ${err.message}`;
        }
        
        appendMessage('bot', errorMsg);
      })
      .finally(() => {
        // Re-enable send button
        sendBtn.disabled = false;
        sendBtn.innerHTML = '📤 Send';
      });
    };

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    let recognizing = false;
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';

    micBtn.onclick = () => {
      if (recognizing) {
        recognition.stop();
        micBtn.innerHTML = `<i class="fas fa-microphone"></i>`;
        recognizing = false;
      } else {
        recognition.start();
        micBtn.innerHTML = `<i class="fas fa-microphone-slash text-danger"></i>`;
        recognizing = true;
      }
    };

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      userInput.value = transcript;
      sendBtn.click();
    };

    recognition.onerror = () => {
      micBtn.innerHTML = `<i class=\"fas fa-microphone\"></i>`;
      recognizing = false;
    };

    document.getElementById('clear-btn').addEventListener('click', async () => {
      if (!confirm('Clear your chat history?')) return;
      try {
        const csrftoken = getCookie('csrftoken');
        const res = await fetch('/clear-chat/', { method: 'POST', headers: { 'X-CSRFToken': csrftoken }});
        if (res.ok) {
          messagesContainer.innerHTML = '';
          appendMessage('bot', 'Chat history cleared.');
        }
      } catch (_) {}
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      const messages = document.querySelectorAll('#messages .message-wrapper');
      let text = '';
      messages.forEach(msg => {
        const sender = msg.classList.contains('user') ? 'You' : 'RAJU-GPT';
        const content = msg.querySelector('.message-bubble')?.innerText || '';
        text += `${sender}: ${content}\n\n`;
      });
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `chat-${new Date().toISOString().split('T')[0]}.txt`;
      a.click();
    });
  </script>
</body>
</html>
