name: CI - Test and Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=myenv,venv,env
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=myenv,venv,env
    
    - name: Check code formatting with black
      run: |
        black --check --exclude="/(myenv|venv|env|migrations)/" .
    
    - name: Run Django checks
      env:
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: True
        SERPAPI_KEY: test-key
      run: |
        python manage.py check
        python manage.py makemigrations --check --dry-run
