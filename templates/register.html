<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register | RAJU-GPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .register-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 1.2rem;
      color: #00f5c9;
      font-size: 1.75rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-group {
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
    }

    .input-group input:focus {
      outline: none;
      background: rgba(0,245,201,0.12);
      box-shadow: 0 0 5px #00f5c9;
    }

    .input-group input::placeholder {
      color: transparent;
    }

    .input-group label {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      transition: all 0.2s ease;
      pointer-events: none;
      color: #ccc;
      font-size: 1rem;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: -10px;
      left: 0.9rem;
      font-size: 0.75rem;
      background: #0f2027;
      padding: 0 4px;
      color: #00f5c9;
    }

    .error-message {
      font-size: 0.95rem;
      color: #ff5c5c;
      text-align: center;
    }

    button {
      background: linear-gradient(to right, #00f5c9, #00c3ff);
      color: #000;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    button:hover {
      box-shadow: 0 6px 18px rgba(0, 245, 201, 0.4);
    }

    .login-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #ccc;
    }

    .login-link a {
      color: #00f5c9;
      text-decoration: none;
      font-weight: 500;
    }

    footer {
    background: rgba(255, 255, 255, 0.05);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    color: #ccc;
    text-align: center;
    padding: 1rem 0;
    margin-top: 3rem;
    font-size: 0.9rem;
    border-radius: 12px 12px 0 0;
  }

    @media (max-width: 768px) {
      .register-container {
        max-width: 95%;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="wrapper">
      <div class="register-container">
        <h2>Create Your Account</h2>
        <form method="post" id="registerForm" novalidate>
          {% csrf_token %}
          <div class="input-group">
            <input type="text" name="first_name" id="first_name" placeholder=" " required autocomplete="given-name" autofocus />
            <label for="first_name">First Name</label>
          </div>
          <div class="input-group">
            <input type="text" name="last_name" id="last_name" placeholder=" " required autocomplete="family-name" />
            <label for="last_name">Last Name</label>
          </div>
          <div class="input-group">
            <input type="email" name="email" id="email" placeholder=" " required autocomplete="email" />
            <label for="email">Email</label>
          </div>
          <div class="input-group">
            <input type="text" name="username" id="username" placeholder=" " required autocomplete="username" />
            <label for="username">Username</label>
          </div>
          <div class="input-group">
            <input type="password" name="password" id="password" placeholder=" " required autocomplete="new-password" />
            <label for="password">Password</label>
          </div>
          <div class="input-group">
            <input type="password" name="confirm_password" id="confirm_password" placeholder=" " required autocomplete="new-password" />
            <label for="confirm_password">Confirm Password</label>
          </div>

          <p id="passwordError" class="error-message" style="display:none;">Passwords do not match.</p>

          <button type="submit">Register</button>
        </form>

        <p class="login-link">
          Already have an account? <a href="{% url 'login' %}">Login here</a>
        </p>

        {% for message in messages %}
          <p class="error-message">{{ message }}</p>
        {% endfor %}
      </div>
    </div>

    <footer>
      &copy; 2025 RAJU-GPT. All rights reserved.
    </footer>
  </div>

<script>
  const form = document.getElementById('registerForm');
  const password = document.getElementById('password');
  const confirmPassword = document.getElementById('confirm_password');
  const passwordError = document.getElementById('passwordError');

  form.addEventListener('submit', function (event) {
    // Get all form inputs
    const inputs = form.querySelectorAll('input[required]');
    let allFilled = true;

    // Check for empty fields
    inputs.forEach(input => {
      if (!input.value.trim()) {
        allFilled = false;
        input.focus();
      }
    });

    // If any field is empty
    if (!allFilled) {
      event.preventDefault();
      passwordError.textContent = "Please fill out all required fields.";
      passwordError.style.display = 'block';
      return;
    }

    // If passwords do not match
    if (password.value !== confirmPassword.value) {
      event.preventDefault();
      passwordError.textContent = "Passwords do not match.";
      passwordError.style.display = 'block';
      confirmPassword.focus();
    } else {
      passwordError.style.display = 'none';
    }
  });
</script>
<!-- Footer -->
<footer>
  © {{ now|date:"Y" }} RAJU-GPT. All rights reserved.
</footer>
</body>
</html>
