<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | RAJU-GPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-size: 400% 400%;
      animation: backgroundAnimation 12s ease infinite;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    @keyframes backgroundAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-container {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      padding: 2.5rem 3rem;
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 600;
      font-size: 1.9rem;
      color: #00f5c9;
      letter-spacing: 1px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .input-group {
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      transition: 0.3s;
    }

    .input-group label {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: #ccc;
      pointer-events: none;
      transition: 0.3s ease;
      background-color: transparent;
      padding: 0;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label,
    .input-group label.active {
      top: -8px;
      left: 10px;
      font-size: 0.75rem;
      color: #00f5c9;
      background-color: rgba(15, 32, 39, 0.85);
      padding: 0 5px;
    }

    .input-group input:focus {
      outline: none;
      box-shadow: 0 0 10px #00f5c9;
    }

    button {
      background: linear-gradient(to right, #00f5c9, #00c3ff);
      color: #000;
      padding: 0.85rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: 0.4s ease;
    }

    button:hover {
      box-shadow: 0 0 15px #00f5c9;
      transform: translateY(-2px);
    }

    .register-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.95rem;
      color: #ccc;
    }

    .register-link a {
      color: #00f5c9;
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #ff5c5c;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 0.8rem;
    }

    footer {
      position: absolute;
      bottom: 15px;
      text-align: center;
      width: 100%;
      font-size: 0.9rem;
      color: #aaa;
      letter-spacing: 0.5px;
    }

    @media screen and (max-height: 600px) {
        footer {
          background: rgba(255, 255, 255, 0.05);
          border-top: 1px solid rgba(255, 255, 255, 0.1);
          backdrop-filter: blur(12px);
          color: #ccc;
          text-align: center;
          padding: 1rem 0;
          margin-top: 3rem;
          font-size: 0.9rem;
          border-radius: 12px 12px 0 0;
        }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2 style="text-align: center;">Welcome to <br> RAJU-GPT</h2>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="input-group">
        <input type="text" name="username" class="input" placeholder=" " required autocomplete="username" />
        <label>Username</label>
      </div>
      <div class="input-group">
        <input type="password" name="password" class="input" placeholder=" " required autocomplete="current-password" />
        <label>Password</label>
      </div>
      <button type="submit">Login</button>
    </form>
    <p class="register-link">Don’t have an account? <a href="{% url 'register' %}">Sign up</a></p>
    {% for message in messages %}
      <p class="error-message">{{ message }}</p>
    {% endfor %}
  </div>

  

  <script>
    // Function to activate labels if input has value (including autofill)
    function activateLabels() {
      document.querySelectorAll('.input').forEach(input => {
        const label = input.nextElementSibling;
        if (input.value.trim() !== '') {
          label.classList.add('active');
        } else {
          label.classList.remove('active');
        }
      });
    }

    // On page load, do the label activation and also simulate focus+blur to fix autofill label issues
    window.addEventListener('load', () => {
      activateLabels();

      // Simulate a quick focus and blur on each input to force autofill detection and label move
      document.querySelectorAll('.input').forEach(input => {
        input.focus();
        input.blur();
      });
    });

    // Also update labels on input typing
    document.querySelectorAll('.input').forEach(input => {
      input.addEventListener('input', () => {
        const label = input.nextElementSibling;
        if (input.value.trim() !== '') {
          label.classList.add('active');
        } else {
          label.classList.remove('active');
        }
      });
    });
  </script>
<!-- Footer -->
<footer>
  © {{ now|date:"Y" }} RAJU-GPT. All rights reserved.
</footer>
</body>
</html>
